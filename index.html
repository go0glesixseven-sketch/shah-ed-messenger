<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHED // SECURE COMMS</title>
    <style>
        :root {
            --bg: #050508;
            --panel: #0a0a10;
            --border: #1a1a25;
            --text: #c0c0c0;
            --accent: #ff0033; /* Кроваво-красный */
            --accent-dim: #660014;
            --success: #00ff66;
        }
        
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Consolas', 'Courier New', monospace; /* Терминальный шрифт */
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, #1a0005 0%, transparent 50%),
                linear-gradient(0deg, transparent 24%, rgba(255, 0, 51, 0.03) 25%, rgba(255, 0, 51, 0.03) 26%, transparent 27%, transparent 74%, rgba(255, 0, 51, 0.03) 75%, rgba(255, 0, 51, 0.03) 76%, transparent 77%, transparent);
            background-size: 100% 100%, 100% 4px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 0 50px rgba(255, 0, 51, 0.1);
            position: relative;
        }

        /* Уголки-рамки для милитари стиля */
        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            transition: all 0.3s;
        }
        .container::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .container::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 0, 51, 0.05);
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-dim);
        }

        .status {
            font-size: 10px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 5px var(--success); }
            50% { opacity: 0.3; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 5px var(--success); }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-dim) transparent;
        }

        .message {
            background: #0f0f16;
            border-left: 2px solid #333;
            padding: 10px 15px;
            max-width: 85%;
            align-self: flex-start;
            font-size: 13px;
            line-height: 1.5;
            position: relative;
            animation: slideIn 0.2s ease-out;
        }

        .message.own {
            align-self: flex-end;
            border-left: none;
            border-right: 2px solid var(--accent);
            background: #1a0a0f;
        }

        .message .meta {
            font-size: 10px;
            color: #555;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            text-transform: uppercase;
        }

        .message.own .meta {
            color: var(--accent-dim);
        }

        .message .user {
            color: var(--accent);
            font-weight: bold;
        }

        .message.own .user {
            color: #ff6688;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            background: #050508;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.1);
        }

        input::placeholder {
            color: #333;
        }

        button {
            padding: 0 25px;
            background: var(--accent);
            color: #000;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #fff;
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }

        /* Модалка для ввода имени */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 8, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            color: var(--accent);
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .overlay input {
            width: 250px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .overlay button {
            padding: 12px 40px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Оверлей для выбора позывного -->
    <div class="overlay" id="nameOverlay">
        <h2>Идентификация</h2>
        <input type="text" id="nameInput" placeholder="Твой позывной" maxlength="15" autocomplete="off">
        <button id="startBtn">Войти в сеть</button>
    </div>

    <div class="header">
        <div class="logo">SHAHED</div>
        <div class="status">
            <div class="status-dot"></div>
            <span id="statusText">Связь...</span>
        </div>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="msgInput" placeholder="Введи сообщение..." autocomplete="off">
        </div>
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // ВСТАВЬ СВОИ ДАННЫЕ СЮДА:
    const SUPABASE_URL = 'https://ТВОЙ_ПРОЕКТ.supabase.co';
    const SUPABASE_ANON_KEY = 'ТВОЙ_ANON_KEY';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Переменные состояния
    let myUsername = '';
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('statusText');
    
    // Элементы оверлея
    const nameOverlay = document.getElementById('nameOverlay');
    const nameInput = document.getElementById('nameInput');
    const startBtn = document.getElementById('startBtn');

    // Инициализация (вход по имени)
    startBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) return;
        
        myUsername = name;
        localStorage.setItem('shahed_username', name); // Запоминаем на будущее
        nameOverlay.classList.add('hidden');
        
        // Загружаем сообщения только после входа
        loadMessages();
        subscribeToRealtime();
        inputEl.focus();
    });

    nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') startBtn.click();
    });

    // Проверка, есть ли сохраненное имя
    const savedName = localStorage.getItem('shahed_username');
    if (savedName) {
        nameInput.value = savedName;
    }

    // --- ФУНКЦИИ ---

    async function loadMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true })
            .limit(100);

        if (error) {
            console.error('Ошибка загрузки:', error);
            statusEl.textContent = 'Ошибка';
            return;
        }

        messagesEl.innerHTML = '';
        data.forEach(renderMessage);
        statusEl.textContent = 'Онлайн';
    }

    function renderMessage(msg) {
        const div = document.createElement('div');
        // Если имя совпадает с нашим — это наше сообщение
        const isOwn = msg.username === myUsername;
        div.className = `message ${isOwn ? 'own' : ''}`;
        
        const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        div.innerHTML = `
            <div class="meta">
                <span class="user">${msg.username || 'UNKNOWN'}</span>
                <span>${time}</span>
            </div>
            <div>${escapeHtml(msg.content)}</div>
        `;
        
        messagesEl.appendChild(div);
        // Автоскролл вниз
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendMessage() {
        const content = inputEl.value.trim();
        if (!content || !myUsername) return;

        inputEl.value = '';
        inputEl.disabled = true;

        const { error } = await supabase
            .from('messages')
            .insert([{ content, username: myUsername }]);

        if (error) {
            console.error('Ошибка отправки:', error);
        }
        
        inputEl.disabled = false;
        inputEl.focus();
    }

    function subscribeToRealtime() {
        supabase.channel('shahed-room')
            .on(
                'postgres_changes',
                { event: 'INSERT', schema: 'public', table: 'messages' },
                (payload) => {
                    renderMessage(payload.new);
                }
            )
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    statusEl.textContent = 'Канал активен';
                }
            });
    }

    // Слушатели кнопок
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

</script>

</body>
</html>
